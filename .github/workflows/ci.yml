name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,mlops]"
      - run: ruff check src tests
      - run: python -m runbook_rag.cli index
      - run: python -m runbook_rag.cli evaluate --min-recall 0.8
      - run: pytest --cov=runbook_rag --cov-report=term-missing --cov-fail-under=75

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: runbook-rag:${{ github.sha }}
