apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-copilot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-copilot-api
  template:
    metadata:
      labels:
        app: incident-copilot-api
    spec:
      containers:
        - name: api
          image: ghcr.io/moe-404/incident-copilot-rag:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: incident-copilot-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incident-copilot-api
spec:
  selector:
    app: incident-copilot-api
  ports:
    - port: 80
      targetPort: 8000
